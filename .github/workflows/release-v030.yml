name: Grounded v0.3.0 evidence assets

on:
  workflow_dispatch:
  push:
    tags: [v0.3.0]

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --disable-pip-version-check uv==0.10.10
          uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run python scripts/fake_quickstart.py
      - run: |
          uv build --wheel --sdist --out-dir dist
          clean_env="$RUNNER_TEMP/clean-env"
          uv venv "$clean_env"
          uv pip install --python "$clean_env/bin/python" dist/*.whl
          "$clean_env/bin/python" -c "import src.api.main"
      - run: |
          uv export --frozen --all-extras --no-emit-project --format requirements.txt --no-hashes --output-file "$RUNNER_TEMP/requirements.lock.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.lock.txt" --no-deps --disable-pip --format cyclonedx-json --output dist/sbom.cdx.json || echo "::warning::locked dependency advisories recorded"
          test -s dist/sbom.cdx.json
          cd dist
          sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grounded-v0.3.0-${{ github.sha }}
          path: dist/
          if-no-files-found: error
