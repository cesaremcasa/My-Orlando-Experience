name: Grounded retrieval baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check uv==0.10.10
      - run: uv sync --frozen --extra dev --extra agentops
      - run: uv run pytest -q
      - run: uv run python scripts/fake_quickstart.py
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: |
          uv export --frozen --all-extras --no-emit-project --format requirements.txt --no-hashes --output-file "$RUNNER_TEMP/requirements.lock.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.lock.txt" --no-deps --disable-pip || echo "::warning::locked dependency advisories recorded"
      - name: secret scan
        run: |
          if git grep -E -- '-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----' -- ':!.git'; then
            echo "private key material must not be committed" >&2
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          uv build --wheel --sdist --out-dir dist
          outside="$RUNNER_TEMP/outside-checkout"
          mkdir -p "$outside"
          uv venv "$outside/venv"
          wheel="$(ls dist/*.whl)"
          uv pip install --python "$outside/venv/bin/python" "${wheel}[agentops]"
          cd "$outside"
          "$outside/venv/bin/python" -c 'import inspect, src.api.main as api_main; from importlib.metadata import version; path=inspect.getfile(api_main); print("api_main_path", path); assert "site-packages" in path, path; assert api_main.app.version=="0.4.1"; assert version("my-orlando-experience")=="0.4.1"'
          "$outside/venv/bin/orlando-agentops-quickstart"
          "$outside/venv/bin/orlando-agentops-eval" --seed 42 --out "$outside/eval-out"
          "$outside/venv/bin/orlando-agentops-gcp-preflight"
          cd -
          uv export --frozen --all-extras --no-emit-project --format requirements.txt --no-hashes --output-file "$RUNNER_TEMP/requirements.lock.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.lock.txt" --no-deps --disable-pip --format cyclonedx-json --output dist/sbom.cdx.json || echo "::warning::locked dependency advisories recorded"
          test -s dist/sbom.cdx.json
          (cd dist && sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS && sha256sum -c SHA256SUMS)
      - run: |
          docker build -t orlando-agentops:ci .
          docker run --rm -e ORLANDO_CONTAINER_EVIDENCE=1 orlando-agentops:ci python -m src.agentops.cli.container_check
          docker run --rm -i orlando-agentops:ci python -c 'import sys; import src.api.main as api_main; from fastapi.testclient import TestClient; blocked=("sentence_transformers","faiss","google.cloud.aiplatform"); imported=[n for n in blocked if n in sys.modules]; assert imported==[], imported; c=TestClient(api_main.app); assert c.get("/health").status_code==200; assert c.get("/agent/health").status_code==200; imported=[n for n in blocked if n in sys.modules]; assert imported==[], imported; print("container-import-health-ok")'
          docker run --rm -e ORLANDO_FAKE_RUNTIME=1 orlando-agentops:ci orlando-agentops-quickstart
