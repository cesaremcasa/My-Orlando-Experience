name: Grounded retrieval baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check uv==0.10.10
      - run: uv sync --frozen --extra dev --extra agentops
      - run: uv run pytest -q
      - run: uv run python scripts/fake_quickstart.py
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: |
          uv export --frozen --all-extras --no-emit-project --format requirements.txt --no-hashes --output-file "$RUNNER_TEMP/requirements.lock.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.lock.txt" --no-deps --disable-pip || echo "::warning::locked dependency advisories recorded"
      - run: |
          uv build --wheel --sdist --out-dir dist
          clean_env="$RUNNER_TEMP/clean-env"
          uv venv "$clean_env"
          uv pip install --python "$clean_env/bin/python" dist/*.whl
          "$clean_env/bin/python" -c "import src.api.main"
